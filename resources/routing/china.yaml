# ClashGate routing group: China
rule-providers:
  China:
    type: http
    behavior: classical
    url: "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/China/China.yaml"
    path: ./ruleset/China.yaml
    interval: 86400
proxy-groups:
  - name: China
    type: select
    include-all: true
    proxies:
      - REJECT
      - DIRECT
rules:
  - RULE-SET,China,China
